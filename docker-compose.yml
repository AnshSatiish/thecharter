services:
  db:
    # PostGIS plus pgvector; see backend/db/Dockerfile
    build: ./backend/db
    image: thecharter-db:16
    environment:
      POSTGRES_DB: charter
      POSTGRES_USER: charter
      # Development default. Anywhere else, set POSTGRES_PASSWORD in the environment (see docs/security/postgresql.md).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-charter}
    ports:
      # This computer only: other machines on the same network cannot reach the database.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charter -d charter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
