# Lint and test the API on every pull request and on pushes to main.
name: Backend tests

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/api/requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest tests/unit -q
      - name: All tests with coverage
        # SQLite and stand-in models: no downloads, no database server, no Ollama needed.
        run: pytest -q --cov=app --cov-report=term-missing
