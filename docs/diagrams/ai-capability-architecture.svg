<text x="110.0" y="106.0" text-anchor="middle" fill="#0b0b0b">project text, narration,</text>
<text x="110.0" y="121.0" text-anchor="middle" fill="#0b0b0b">PDF</text>
<rect x="215" y="70" width="140" height="64" rx="6" fill="#f4f7fb" stroke="#2a78d6" stroke-width="1.3"/>
<text x="285.0" y="98.5" text-anchor="middle" fill="#0b0b0b" font-weight="bold" font-size="13">Text extraction</text>
<text x="285.0" y="113.5" text-anchor="middle" fill="#0b0b0b">pypdf, per page</text>
<rect x="390" y="70" width="150" height="64" rx="6" fill="#fdece4" stroke="#eb6834" stroke-width="1.3"/>
<text x="465.0" y="91.0" text-anchor="middle" fill="#0b0b0b" font-weight="bold" font-size="13">Passage chunking</text>
<text x="465.0" y="106.0" text-anchor="middle" fill="#0b0b0b">whole sentences,</text>
<text x="465.0" y="121.0" text-anchor="middle" fill="#0b0b0b">40 words, 1 overlap</text>
<rect x="575" y="70" width="165" height="64" rx="6" fill="#fdece4" stroke="#eb6834" stroke-width="1.3"/>
<text x="657.5" y="91.0" text-anchor="middle" fill="#0b0b0b" font-weight="bold" font-size="13">Sentence model</text>
<text x="657.5" y="106.0" text-anchor="middle" fill="#0b0b0b">bge-small-en-v1.5,</text>
<text x="657.5" y="121.0" text-anchor="middle" fill="#0b0b0b">ONNX, 384 dimensions</text>
<rect x="390" y="180" width="150" height="60" rx="6" fill="#f4f7fb" stroke="#2a78d6" stroke-width="1.3"/>
<text x="465.0" y="199.0" text-anchor="middle" fill="#0b0b0b" font-weight="bold" font-size="13">Keyword text</text>
<text x="465.0" y="214.0" text-anchor="middle" fill="#0b0b0b">accent folding,</text>
<text x="465.0" y="229.0" text-anchor="middle" fill="#0b0b0b">field weights A to D</text>
<path d="M960,104 A90.0,9 0 0 1 1140,104 L1140,221 A90.0,9 0 0 1 960,221 Z" fill="#e9f7f1" stroke="#1baf7a" stroke-width="1.3"/>
