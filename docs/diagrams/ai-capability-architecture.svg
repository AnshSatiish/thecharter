<text x="437.5" y="476.0" text-anchor="middle" fill="#0b0b0b">GET /api/projects/search</text>
<text x="437.5" y="491.0" text-anchor="middle" fill="#0b0b0b">mode, limit</text>
<rect x="575" y="330" width="160" height="60" rx="6" fill="#fdece4" stroke="#eb6834" stroke-width="1.3"/>
<text x="655.0" y="356.5" text-anchor="middle" fill="#0b0b0b" font-weight="bold" font-size="13">Embed the query</text>
<text x="655.0" y="371.5" text-anchor="middle" fill="#0b0b0b">same sentence model</text>
<polygon points="835.0,320 895,360.0 835.0,400 775,360.0" fill="#fff6e0" stroke="#c98a00" stroke-width="1.3"/>
<text x="835.0" y="356.5" text-anchor="middle" fill="#0b0b0b" font-weight="bold" font-size="13">Model</text>
<text x="835.0" y="371.5" text-anchor="middle" fill="#0b0b0b">loaded?</text>
<rect x="950" y="330" width="190" height="60" rx="6" fill="#fdece4" stroke="#eb6834" stroke-width="1.3"/>
<text x="1045.0" y="349.0" text-anchor="middle" fill="#0b0b0b" font-weight="bold" font-size="13">Vector search</text>
<text x="1045.0" y="364.0" text-anchor="middle" fill="#0b0b0b">pgvector HNSW, cosine</text>
<text x="1045.0" y="379.0" text-anchor="middle" fill="#0b0b0b">(numpy without pgvector)</text>
<rect x="950" y="430" width="190" height="60" rx="6" fill="#fdece4" stroke="#eb6834" stroke-width="1.3"/>
<text x="1045.0" y="449.0" text-anchor="middle" fill="#0b0b0b" font-weight="bold" font-size="13">Relevance cut-off</text>
<text x="1045.0" y="464.0" text-anchor="middle" fill="#0b0b0b">at least 0.575 and within</text>
<text x="1045.0" y="479.0" text-anchor="middle" fill="#0b0b0b">95% of the top score</text>
<rect x="770" y="428" width="130" height="64" rx="6" fill="#fff6e0" stroke="#c98a00" stroke-width="1.3"/>
<text x="835.0" y="449.0" text-anchor="middle" fill="#0b0b0b" font-weight="bold" font-size="13">Fallback</text>
<text x="835.0" y="464.0" text-anchor="middle" fill="#0b0b0b">skip meaning, return</text>
<text x="835.0" y="479.0" text-anchor="middle" fill="#0b0b0b">keyword results only</text>
<rect x="760" y="540" width="150" height="64" rx="6" fill="#f4f7fb" stroke="#2a78d6" stroke-width="1.3"/>
<text x="835.0" y="561.0" text-anchor="middle" fill="#0b0b0b" font-weight="bold" font-size="13">Keyword search</text>
<text x="835.0" y="576.0" text-anchor="middle" fill="#0b0b0b">to_tsquery, stems and</text>
<text x="835.0" y="591.0" text-anchor="middle" fill="#0b0b0b">prefixes, ts_rank_cd</text>
<rect x="950" y="540" width="190" height="64" rx="6" fill="#fdece4" stroke="#eb6834" stroke-width="1.3"/>
<text x="1045.0" y="561.0" text-anchor="middle" fill="#0b0b0b" font-weight="bold" font-size="13">Hybrid fusion</text>
<text x="1045.0" y="576.0" text-anchor="middle" fill="#0b0b0b">reciprocal rank fusion, k = 60:</text>
<text x="1045.0" y="591.0" text-anchor="middle" fill="#0b0b0b">meaning + every-word matches</text>
<rect x="40" y="670" width="650" height="84" rx="6" fill="#fff6e0" stroke="#c98a00" stroke-width="1.3"/>
<text x="365.0" y="693.5" text-anchor="middle" fill="#0b0b0b" font-weight="bold" font-size="13">Search in the browser (the live site, no backend)</text>
<text x="365.0" y="708.5" text-anchor="middle" fill="#0b0b0b">Transformers.js runs the same model (bge-small-en-v1.5, q8): cosine over every passage,</text>
<text x="365.0" y="723.5" text-anchor="middle" fill="#0b0b0b">fused with the page&#x27;s keyword ranking (RRF, k = 60).</text>
<text x="365.0" y="738.5" text-anchor="middle" fill="#0b0b0b">If the model cannot run: the keyword ranking alone, and the site says so.</text>
<rect x="950" y="670" width="190" height="84" rx="6" fill="#e9f7f1" stroke="#1baf7a" stroke-width="1.3"/>
