<text x="1050.0" y="141.5" text-anchor="middle" fill="#0b0b0b" font-weight="bold" font-size="13">PostgreSQL</text>
<text x="1050.0" y="156.5" text-anchor="middle" fill="#0b0b0b">search_chunks:</text>
<text x="1050.0" y="171.5" text-anchor="middle" fill="#0b0b0b">vector(384), HNSW</text>
<text x="1050.0" y="186.5" text-anchor="middle" fill="#0b0b0b">projects.search_tsv:</text>
<text x="1050.0" y="201.5" text-anchor="middle" fill="#0b0b0b">tsvector, GIN</text>
